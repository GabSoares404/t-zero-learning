algorithm: ppo
env_id: LunarLander-v3
seed: 1
cuda: false
total_timesteps: 1800000
num_envs: 4

track: true
capture_video: false
save_model: true
checkpoint_every: 0

network: DiscreteActorCritic
network_kwargs:
  activation: Tanh
  hidden_layers_size: 64

ppo:
  learning_rate: 3.5e-4
  anneal_lr: true
  num_steps: 512
  gamma: 0.999
  gae_lambda: 0.95
  num_minibatches: 8
  update_epochs: 8
  norm_adv: true
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.001
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null
